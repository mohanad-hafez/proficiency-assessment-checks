name: Matched context assessment
on:
  push:
    branches: [matched-proficiency-publish-01]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        arm: [agent, script]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: assessment-${{ matrix.arm }}
          path: evidence
          github-token: ${{ github.token }}
          run-id: 42663377026
      - name: Publish the verified assessment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          ARM: ${{ matrix.arm }}
        with:
          retries: 0
          script: |
            const fs = require('node:fs');
            const {createHash} = require('node:crypto');
            const cfg = require('./.github/proficiency/targets.json');
            const pull_number = cfg.prs[process.env.ARM];
            const pr = (await github.rest.pulls.get({...context.repo,pull_number})).data;
            if (pr.state !== 'open' || pr.base.sha !== cfg.base || pr.head.sha !== cfg.head) throw Error('Target moved');
            const body = fs.readFileSync('evidence/assessment-comment.md','utf8');
            if (createHash('sha256').update(body).digest('hex') !== require('./.github/proficiency/output-hashes.json')[process.env.ARM]) throw Error('Assessment failed validation');
            const comment = await github.rest.issues.createComment({...context.repo,issue_number:pull_number,body});
            core.info('Published assessment ' + comment.data.html_url);
